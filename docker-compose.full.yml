# ==============================================================================
# Docker Compose - Khởi chạy trọn gói hệ thống (PostgreSQL + Backend + Frontend)
# Lưu ý: Các khóa bí mật (Gemini API Key, payOS, JWT Secret) TUYỆT ĐỐI KHÔNG lưu
# trong file này mà được nạp an toàn từ file backend/.env lúc khởi chạy (runtime).
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: nha_tro_db
    restart: always
    environment:
      POSTGRES_DB: nha_tro
      POSTGRES_USER: nha_tro_owner
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - nha_tro_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nha_tro_owner -d nha_tro"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nha_tro_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nha_tro_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://nha_tro_owner:change_me@postgres:5432/nha_tro?schema=public
      APP_DATABASE_URL: postgresql://app_user:change_me@postgres:5432/nha_tro?schema=public
      SYSTEM_DATABASE_URL: postgresql://app_system:change_me@postgres:5432/nha_tro?schema=public
      RUN_SEED_DEMO: "true"
    ports:
      - "4000:4000"
    networks:
      - nha_tro_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: nha_tro_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - nha_tro_net

volumes:
  nha_tro_pgdata:

networks:
  nha_tro_net:
    driver: bridge
